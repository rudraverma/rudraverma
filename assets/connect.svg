<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <!-- Hex grid background pattern -->
    <pattern id="hexgrid" width="34" height="30" patternUnits="userSpaceOnUse">
      <polygon points="17,0 34,8.5 34,21.5 17,30 0,21.5 0,8.5"
               fill="none" stroke="#0066cc" stroke-width="0.4" opacity="0.13"/>
    </pattern>

    <!-- Scan line gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4da6ff" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#4da6ff" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#4da6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4da6ff" stop-opacity="0"/>
    </linearGradient>

    <!-- CTA card gradient -->
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#001433"/>
      <stop offset="100%" stop-color="#001020"/>
    </linearGradient>

    <!-- Header fill -->
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0066cc" stop-opacity="0.28"/>
      <stop offset="50%"  stop-color="#0066cc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0066cc" stop-opacity="0.28"/>
    </linearGradient>

    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }

      /* scan line sweeps top→bottom every 5 s */
      @keyframes scan {
        0%   { transform: translateY(-10px); opacity: 0; }
        4%   { opacity: 1; }
        96%  { opacity: 1; }
        100% { transform: translateY(350px); opacity: 0; }
      }
      /* outer border breathes */
      @keyframes breathe {
        0%, 100% { stroke-opacity: .45; }
        50%       { stroke-opacity: 1;  }
      }
      /* CTA button pulses */
      @keyframes ctaPulse {
        0%, 100% { opacity: .80; }
        50%       { opacity: 1;  }
      }
      /* green LIVE dot */
      @keyframes liveBlink {
        0%, 100% { opacity: 1;   }
        50%       { opacity: .3; }
      }
      /* corner gold flickers */
      @keyframes cornerFlicker {
        0%,100% { opacity: .7; }
        50%      { opacity: 1; }
      }

      .scan-line    { animation: scan          5s linear      infinite; }
      .outer-border { animation: breathe       3s ease-in-out infinite; }
      .cta-btn      { animation: ctaPulse      2.5s ease-in-out infinite; }
      .live-dot     { animation: liveBlink     1.2s ease-in-out infinite; }
      .corner       { animation: cornerFlicker 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="800" height="340" fill="#0a1220"/>
  <rect width="800" height="340" fill="url(#hexgrid)"/>

  <!-- outer glow border -->
  <rect x="1.5" y="1.5" width="797" height="337" rx="8"
        fill="none" stroke="#0066cc" stroke-width="2" class="outer-border"/>
  <!-- inner faint border -->
  <rect x="7" y="7" width="786" height="326" rx="6"
        fill="none" stroke="#0066cc" stroke-width=".5" opacity=".2"/>

  <!-- ═══ CORNER ACCENTS ═══ -->
  <path d="M1,36 L1,1 L36,1"   fill="none" stroke="#f5a623" stroke-width="2.5" class="corner"/>
  <path d="M764,1 L799,1 L799,36"  fill="none" stroke="#f5a623" stroke-width="2.5" class="corner"/>
  <path d="M1,304 L1,339 L36,339"  fill="none" stroke="#f5a623" stroke-width="2.5" class="corner"/>
  <path d="M764,339 L799,339 L799,304" fill="none" stroke="#f5a623" stroke-width="2.5" class="corner"/>

  <!-- ═══ SCAN LINE ═══ -->
  <rect x="0" y="0" width="800" height="8" fill="url(#scanGrad)" class="scan-line"/>

  <!-- ═══ HEADER ═══ -->
  <rect x="1.5" y="1.5" width="797" height="60" rx="7" fill="url(#hdrGrad)"/>
  <line x1="1.5" y1="61.5" x2="798.5" y2="61.5" stroke="#0066cc" stroke-width=".8" opacity=".55"/>

  <!-- gold accent bar -->
  <rect x="18" y="14" width="3.5" height="34" rx="1.5" fill="#f5a623"/>

  <!-- CH logo -->
  <text x="30" y="42" class="mono" font-size="22" font-weight="bold"
        fill="#f5a623" letter-spacing="2">CH</text>

  <!-- vertical divider -->
  <line x1="70" y1="14" x2="70" y2="48" stroke="#0066cc" stroke-width="1" opacity=".45"/>

  <!-- name + title -->
  <text x="82" y="32" class="mono" font-size="15" font-weight="bold"
        fill="#ffffff" letter-spacing="3">RUDRA VERMA</text>
  <text x="82" y="50" class="mono" font-size="9.5"
        fill="#4da6ff" letter-spacing="1.8">SENIOR CYBER SECURITY ARCHITECT // CYBERHAWK CONSULTANCY // NZ</text>

  <!-- right: label + domain -->
  <text x="582" y="31" class="mono" font-size="10" fill="#0066cc"
        letter-spacing="3" opacity=".9">// CONNECT</text>
  <text x="582" y="50" class="mono" font-size="9" fill="#7d8590"
        letter-spacing=".5">cyberhawkthreatintel.com</text>

  <!-- LIVE indicator -->
  <circle cx="776" cy="25" r="5.5" fill="#00ff41" class="live-dot"/>
  <text x="776" y="46" class="mono" font-size="8" fill="#00ff41"
        text-anchor="middle" letter-spacing="1">LIVE</text>

  <!-- ═══ WEBSITE CTA CARD ═══ -->
  <rect x="16" y="74" width="768" height="76" rx="6" fill="url(#ctaGrad)"/>
  <rect x="16" y="74" width="768" height="76" rx="6"
        fill="none" stroke="#0066cc" stroke-width="1"/>
  <!-- left accent -->
  <rect x="16" y="74" width="4" height="76" rx="2" fill="#0066cc"/>

  <!-- globe icon -->
  <g transform="translate(46,112)">
    <circle cx="0" cy="0" r="19" fill="none" stroke="#0066cc" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="7.5" ry="19" fill="none" stroke="#0066cc" stroke-width="1"/>
    <line x1="-19" y1="0"  x2="19" y2="0"  stroke="#0066cc" stroke-width=".8"/>
    <line x1="-17" y1="-9" x2="17" y2="-9" stroke="#0066cc" stroke-width=".6"/>
    <line x1="-17" y1="9"  x2="17" y2="9"  stroke="#0066cc" stroke-width=".6"/>
  </g>

  <!-- URL + description -->
  <text x="84" y="103" class="mono" font-size="21" font-weight="bold"
        fill="#ffffff" letter-spacing=".5">cyberhawkthreatintel.com</text>
  <text x="84" y="123" class="mono" font-size="10.5"
        fill="#7d8590">AI-powered threat intelligence · 272,000+ IOCs · 79 live feeds · MISP integrated</text>
  <text x="84" y="140" class="mono" font-size="9.5"
        fill="#4da6ff" letter-spacing=".5">Free account available · real-time threat dashboards · hunt now</text>

  <!-- CTA button -->
  <rect x="592" y="89" width="178" height="46" rx="5"
        fill="#0066cc" class="cta-btn"/>
  <rect x="592" y="89" width="178" height="46" rx="5"
        fill="none" stroke="#4da6ff" stroke-width="1" opacity=".7"/>
  <text x="681" y="108" class="mono" font-size="9.5" fill="#cce5ff"
        text-anchor="middle" letter-spacing="2">SIGN UP FREE</text>
  <text x="681" y="126" class="mono" font-size="14" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">→ GET ACCESS</text>

  <!-- ═══ SOCIAL DIVIDER ═══ -->
  <line x1="16"  y1="165" x2="280" y2="165" stroke="#0066cc" stroke-width=".5" opacity=".4"/>
  <text x="400" y="169.5" class="mono" font-size="9" fill="#4da6ff"
        text-anchor="middle" letter-spacing="3" opacity=".85">SOCIAL CHANNELS</text>
  <line x1="520" y1="165" x2="784" y2="165" stroke="#0066cc" stroke-width=".5" opacity=".4"/>

  <!-- ═══ SOCIAL CARDS ═══ -->

  <!-- YOUTUBE (wide – 2 handles) x=16, w=212 -->
  <rect x="16" y="178" width="212" height="88" rx="5" fill="#0d1628"/>
  <rect x="16" y="178" width="212" height="88" rx="5"
        fill="none" stroke="#cc2200" stroke-width="1" opacity=".75"/>
  <!-- YT icon -->
  <rect x="30" y="196" width="30" height="20" rx="3.5" fill="#ff0000"/>
  <polygon points="39.5,200.5 39.5,211.5 50,206" fill="white"/>
  <!-- labels -->
  <text x="68" y="207" class="mono" font-size="8.5" fill="#ff5555"
        letter-spacing="2">YOUTUBE</text>
  <text x="68" y="221" class="mono" font-size="10" fill="#ffffff">@cyberhawkconsultancy</text>
  <line x1="30" y1="232" x2="214" y2="232" stroke="#cc2200" stroke-width=".5" opacity=".4"/>
  <text x="30" y="247" class="mono" font-size="9" fill="#aaaaaa">also on: </text>
  <text x="84" y="247" class="mono" font-size="10" fill="#ffaaaa">@cyberhawkk</text>
  <text x="30" y="260" class="mono" font-size="8" fill="#7d8590"
        letter-spacing=".5">hacking · security · threat intel</text>

  <!-- X / TWITTER x=236, w=168 -->
  <rect x="236" y="178" width="168" height="88" rx="5" fill="#0d1628"/>
  <rect x="236" y="178" width="168" height="88" rx="5"
        fill="none" stroke="#555" stroke-width="1" opacity=".9"/>
  <!-- X icon (two crossed lines) -->
  <line x1="252" y1="196" x2="270" y2="218" stroke="#ffffff" stroke-width="2.8"/>
  <line x1="270" y1="196" x2="252" y2="218" stroke="#ffffff" stroke-width="2.8"/>
  <text x="283" y="207" class="mono" font-size="8.5" fill="#aaaaaa"
        letter-spacing="2">X / TWITTER</text>
  <text x="252" y="232" class="mono" font-size="10.5" fill="#ffffff">@cyberhawkintel</text>
  <line x1="252" y1="240" x2="392" y2="240" stroke="#555" stroke-width=".5" opacity=".5"/>
  <text x="252" y="255" class="mono" font-size="8.5" fill="#7d8590">threat intel · analysis · news</text>
  <text x="252" y="262" class="mono" font-size="8" fill="#555">// updates · advisories</text>

  <!-- TIKTOK x=412, w=168 -->
  <rect x="412" y="178" width="168" height="88" rx="5" fill="#0d1628"/>
  <rect x="412" y="178" width="168" height="88" rx="5"
        fill="none" stroke="#69c9d0" stroke-width="1" opacity=".75"/>
  <!-- TikTok icon: stylised note -->
  <text x="427" y="222" class="mono" font-size="28" fill="#69c9d0" opacity=".9">♪</text>
  <text x="455" y="207" class="mono" font-size="8.5" fill="#69c9d0"
        letter-spacing="2">TIKTOK</text>
  <text x="428" y="232" class="mono" font-size="10" fill="#ffffff">@cyberhawkthreat</text>
  <text x="428" y="246" class="mono" font-size="10.5" fill="#ffffff">intel</text>
  <line x1="428" y1="252" x2="568" y2="252" stroke="#69c9d0" stroke-width=".5" opacity=".4"/>
  <text x="428" y="263" class="mono" font-size="8" fill="#7d8590">hacking shorts · news</text>

  <!-- TELEGRAM x=588, w=196 -->
  <rect x="588" y="178" width="196" height="88" rx="5" fill="#0d1628"/>
  <rect x="588" y="178" width="196" height="88" rx="5"
        fill="none" stroke="#26A5E4" stroke-width="1" opacity=".75"/>
  <!-- Telegram paper-plane icon -->
  <polygon points="604,218 624,206 618,226" fill="#26A5E4" opacity=".9"/>
  <polygon points="614,222 618,226 622,213" fill="#1a7bbf"/>
  <line x1="606" y1="217" x2="624" y2="206" stroke="#26A5E4" stroke-width=".6"/>
  <text x="636" y="207" class="mono" font-size="8.5" fill="#26A5E4"
        letter-spacing="2">TELEGRAM</text>
  <text x="604" y="232" class="mono" font-size="10" fill="#ffffff">@cyberhawkthreat</text>
  <text x="604" y="246" class="mono" font-size="10.5" fill="#ffffff">intel</text>
  <line x1="604" y1="252" x2="772" y2="252" stroke="#26A5E4" stroke-width=".5" opacity=".4"/>
  <text x="604" y="263" class="mono" font-size="8" fill="#7d8590">intel channel · alerts</text>

  <!-- ═══ FOOTER ═══ -->
  <line x1="1.5" y1="278" x2="798.5" y2="278"
        stroke="#0066cc" stroke-width=".5" opacity=".35"/>
  <rect x="1.5" y="278" width="797" height="61" rx="0" fill="#0066cc" opacity=".05"/>

  <text x="400" y="302" class="mono" font-size="10" fill="#4da6ff"
        text-anchor="middle" letter-spacing="2">
    RUDRA VERMA · SENIOR SECURITY ARCHITECT · CYBERHAWK CONSULTANCY
  </text>
  <text x="400" y="320" class="mono" font-size="9" fill="#7d8590"
        text-anchor="middle" letter-spacing="1">
    cyberhawkthreatintel.com · NZ · Building the tools that didn't exist.
  </text>
  <text x="400" y="334" class="mono" font-size="8" fill="#444"
        text-anchor="middle">
    Authorized security research &amp; penetration testing only. Unauthorized use is illegal.
  </text>
</svg>

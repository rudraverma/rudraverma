<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Fire gradient: outer to inner -->
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff6a00" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#ff4500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2200" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Ring gradients -->
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff6a00"/>
      <stop offset="25%"  stop-color="#ffcc00"/>
      <stop offset="50%"  stop-color="#ff4500"/>
      <stop offset="75%"  stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>

    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0066cc"/>
      <stop offset="50%"  stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0044aa"/>
    </linearGradient>

    <linearGradient id="ring3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff4400"/>
      <stop offset="50%"  stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </linearGradient>

    <!-- Clip for circular logo -->
    <clipPath id="circle-clip">
      <circle cx="110" cy="110" r="74"/>
    </clipPath>

    <style>
      .spin-cw  { animation: spin-cw  4s linear infinite; transform-origin: 110px 110px; }
      .spin-ccw { animation: spin-ccw 6s linear infinite; transform-origin: 110px 110px; }
      .spin-slow { animation: spin-cw 10s linear infinite; transform-origin: 110px 110px; }
      .pulse    { animation: pulse 2s ease-in-out infinite; transform-origin: 110px 110px; }
      .glow     { animation: glow 2s ease-in-out infinite; }

      @keyframes spin-cw  { to { transform: rotate(360deg);  } }
      @keyframes spin-ccw { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%,100% { transform: scale(1);    opacity: 0.8; }
        50%     { transform: scale(1.05); opacity: 1;   }
      }
      @keyframes glow {
        0%,100% { opacity: 0.6; }
        50%     { opacity: 1.0; }
      }
    </style>
  </defs>

  <!-- Outer glow background -->
  <circle cx="110" cy="110" r="108" fill="#0d1117"/>
  <circle cx="110" cy="110" r="104" fill="url(#fireGlow)" class="glow"/>

  <!-- Rotating fire ring (outermost) -->
  <g class="spin-cw">
    <circle cx="110" cy="110" r="100" fill="none" stroke="url(#ring1)" stroke-width="3" stroke-dasharray="18 8" opacity="0.9"/>
  </g>

  <!-- Rotating blue ring -->
  <g class="spin-ccw">
    <circle cx="110" cy="110" r="94" fill="none" stroke="url(#ring2)" stroke-width="2" stroke-dasharray="12 6" opacity="0.7"/>
  </g>

  <!-- Fire dots ring (slow spin) -->
  <g class="spin-slow">
    <circle cx="110" cy="10"  r="3.5" fill="#ff6a00" opacity="0.9"/>
    <circle cx="110" cy="210" r="3.5" fill="#ff4500" opacity="0.9"/>
    <circle cx="10"  cy="110" r="3.5" fill="#ffaa00" opacity="0.9"/>
    <circle cx="210" cy="110" r="3.5" fill="#ff6a00" opacity="0.9"/>
    <circle cx="33"  cy="33"  r="2.5" fill="#ff8800" opacity="0.7"/>
    <circle cx="187" cy="33"  r="2.5" fill="#ff8800" opacity="0.7"/>
    <circle cx="33"  cy="187" r="2.5" fill="#ffcc00" opacity="0.7"/>
    <circle cx="187" cy="187" r="2.5" fill="#ffcc00" opacity="0.7"/>
  </g>

  <!-- Inner ring (fire) -->
  <g class="spin-ccw">
    <circle cx="110" cy="110" r="88" fill="none" stroke="url(#ring3)" stroke-width="3.5" stroke-dasharray="6 4" opacity="0.85"/>
  </g>

  <!-- Dark background circle for logo -->
  <circle cx="110" cy="110" r="79" fill="#0d1117"/>
  <circle cx="110" cy="110" r="77" fill="#0a0f1a"/>

  <!-- Logo image -->
  <image href="https://media.cyberhawkthreatintel.com/general/1771234479938-y9566.png"
         x="36" y="36" width="148" height="148"
         clip-path="url(#circle-clip)"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Pulsing inner glow overlay -->
  <circle cx="110" cy="110" r="77" fill="none" stroke="#ff6a00" stroke-width="1.5" class="pulse" opacity="0.5"/>
  <circle cx="110" cy="110" r="74" fill="none" stroke="#0066cc" stroke-width="1"   class="glow"  opacity="0.4"/>
</svg>

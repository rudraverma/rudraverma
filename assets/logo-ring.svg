<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a2a4a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a1220" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d4890a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a1220" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="logoClip">
      <circle cx="120" cy="120" r="68"/>
    </clipPath>
    <style>
      .r1 { animation: spin  18s linear infinite; transform-origin: 120px 120px; }
      .r2 { animation: rspin 12s linear infinite; transform-origin: 120px 120px; }
      .r3 { animation: spin  28s linear infinite; transform-origin: 120px 120px; }
      .r4 { animation: rspin 20s linear infinite; transform-origin: 120px 120px; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 120px 120px; }
      .scan  { animation: scan  4s ease-in-out infinite; }

      @keyframes spin  { to { transform: rotate( 360deg); } }
      @keyframes rspin { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%,100% { opacity: 0.55; transform: scale(1);    }
        50%     { opacity: 0.90; transform: scale(1.012); }
      }
      @keyframes scan {
        0%,100% { opacity: 0.3; }
        50%     { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background -->
  <circle cx="120" cy="120" r="120" fill="url(#bgGlow)"/>
  <circle cx="120" cy="120" r="110" fill="url(#innerGlow)"/>

  <!-- ── RING 1 — outermost, fine dashes, dark amber ── -->
  <g class="r1">
    <circle cx="120" cy="120" r="112"
      fill="none" stroke="#8b5e0a" stroke-width="1"
      stroke-dasharray="2 6"/>
  </g>

  <!-- ── RING 2 — main outer ring, bold dashes, gold ── -->
  <g class="r2">
    <circle cx="120" cy="120" r="106"
      fill="none" stroke="#c47b00" stroke-width="2.5"
      stroke-dasharray="14 5"/>
    <!-- tick marks at cardinal/intercardinal points -->
    <line x1="120" y1="14"  x2="120" y2="5"  stroke="#f5a623" stroke-width="2"/>
    <line x1="120" y1="226" x2="120" y2="235" stroke="#f5a623" stroke-width="2"/>
    <line x1="14"  y1="120" x2="5"  y2="120" stroke="#f5a623" stroke-width="2"/>
    <line x1="226" y1="120" x2="235" y2="120" stroke="#f5a623" stroke-width="2"/>
    <line x1="45"  y1="45"  x2="39"  y2="39"  stroke="#d4890a" stroke-width="1.5"/>
    <line x1="195" y1="45"  x2="201" y2="39"  stroke="#d4890a" stroke-width="1.5"/>
    <line x1="45"  y1="195" x2="39"  y2="201" stroke="#d4890a" stroke-width="1.5"/>
    <line x1="195" y1="195" x2="201" y2="201" stroke="#d4890a" stroke-width="1.5"/>
  </g>

  <!-- ── RING 3 — mid ring, dotted amber ── -->
  <g class="r3">
    <circle cx="120" cy="120" r="96"
      fill="none" stroke="#a06810" stroke-width="1.5"
      stroke-dasharray="3 7"/>
  </g>

  <!-- ── RING 4 — inner ring, segmented, bright gold ── -->
  <g class="r4">
    <circle cx="120" cy="120" r="87"
      fill="none" stroke="#d4890a" stroke-width="2"
      stroke-dasharray="10 4"/>
    <!-- small diamonds at 8 points -->
    <circle cx="120" cy="33"  r="2.5" fill="#f5a623"/>
    <circle cx="120" cy="207" r="2.5" fill="#f5a623"/>
    <circle cx="33"  cy="120" r="2.5" fill="#f5a623"/>
    <circle cx="207" cy="120" r="2.5" fill="#f5a623"/>
    <circle cx="58"  cy="58"  r="2"   fill="#d4890a"/>
    <circle cx="182" cy="58"  r="2"   fill="#d4890a"/>
    <circle cx="58"  cy="182" r="2"   fill="#d4890a"/>
    <circle cx="182" cy="182" r="2"   fill="#d4890a"/>
  </g>

  <!-- ── RING 5 — innermost ring, fine, pulsing ── -->
  <g class="pulse">
    <circle cx="120" cy="120" r="77"
      fill="none" stroke="#f5a623" stroke-width="1.2"
      stroke-dasharray="4 3" opacity="0.7"/>
  </g>

  <!-- ── Logo background plate ── -->
  <circle cx="120" cy="120" r="72" fill="#0a1220"/>
  <circle cx="120" cy="120" r="70" fill="#0d1628"/>

  <!-- ── CyberHawk Logo ── -->
  <image href="./cyberhawk-logo.png"
         x="50" y="50" width="140" height="140"
         clip-path="url(#logoClip)"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- ── Subtle inner glow rim ── -->
  <circle cx="120" cy="120" r="70"
    fill="none" stroke="#c47b00" stroke-width="1.5"
    opacity="0.5" class="scan"/>
</svg>

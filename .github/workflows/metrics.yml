name: 📊 Update GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual trigger
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # ── 1. Base: header + activity + community + repos ────────────────────
      - name: 📊 Base Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Pacific/Auckland
          config_display: large

      # ── 2. Languages ──────────────────────────────────────────────────────
      - name: 🈷️ Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, less, scss, dockerfile, makefile, tex, batchfile, cmake, shell
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          config_timezone: Pacific/Auckland

      # ── 3. Coding Habits & Charts ─────────────────────────────────────────
      - name: 💡 Coding Habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30
          plugin_habits_limit: 5
          config_timezone: Pacific/Auckland

      # ── 4. Isometric Contribution Calendar ───────────────────────────────
      - name: 📅 Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Pacific/Auckland

      # ── 5. Starred Topics / Mastered Technologies (icon mode) ─────────────
      - name: 🏷️ Topics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons
          config_timezone: Pacific/Auckland

      # ── 6. Recent Activity ────────────────────────────────────────────────
      - name: 📰 Recent Activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 7
          plugin_activity_days: 0
          plugin_activity_filter: issue, pr, release, fork, review, ref/create, push
          config_timezone: Pacific/Auckland

      # ── 7. PageSpeed — CyberHawk site ─────────────────────────────────────
      - name: ⚡ PageSpeed
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.pagespeed.svg
          token: NOT_NEEDED
          user: rudraverma
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://www.cyberhawkthreatintel.com
          plugin_pagespeed_detailed: yes
          config_timezone: Pacific/Auckland
        continue-on-error: true

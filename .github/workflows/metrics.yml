name: 📊 Update GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # ── 1. Base stats ──────────────────────────────────────────────────────
      - name: 📊 Base Metrics
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: header, activity, community, repositories
          config_timezone: Pacific/Auckland
          config_display: large

      # ── 2. Languages ──────────────────────────────────────────────────────
      - name: 🈷️ Languages
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, less, scss, dockerfile, makefile, tex, batchfile, cmake, shell
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          config_timezone: Pacific/Auckland

      # ── 3. Isometric Calendar (full year) ─────────────────────────────────
      - name: 📅 Isometric Calendar
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Pacific/Auckland

      # ── 4. Starred Topics / Tech icons ────────────────────────────────────
      - name: 🏷️ Topics
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          filename: metrics.topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudraverma
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons
          config_timezone: Pacific/Auckland
